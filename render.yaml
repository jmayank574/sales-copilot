services:
  - type: web
    name: sales-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: GOOGLE_SHEET_ID
        value: 1bsdzYTqzArJQRM12chWo9rOFD7h-r_kc1nLlZaQXuOY
      - key: APIFY_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TYPEFORM_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
